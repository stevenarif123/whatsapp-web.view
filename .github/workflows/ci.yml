# Checks every push and pull request: Go vet, tests, a build, and the injected scripts' syntax.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false # dependencies are vendored

      - name: Vet
        run: go vet .

      - name: Test
        run: go test -count=1 .

      - name: Build
        run: go build -ldflags="-H windowsgui -s -w" -o WhatsApp.exe .

      - name: Check injected scripts
        shell: bash
        run: for f in assets/*.js; do node --check "$f"; done
